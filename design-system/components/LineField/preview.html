<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>LineField</title>
<style>html,body{margin:0} body{background:var(--surface);} .stage{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-5);padding:var(--space-5);}</style>
</head>
<body class="ss">
<div class="stage" style="display:grid;gap:var(--space-3);max-width:420px">
  <label class="ss-line"><span class="ss-line__label">Nome del gruppo:</span><input class="ss-line__input" value="Amici di Natale"></label>
  <label class="ss-line"><span class="ss-line__label">Budget:</span><input class="ss-line__input" inputmode="numeric" placeholder="30 €"></label>
  <label class="ss-line"><span class="ss-line__label">Scambio il:</span><input class="ss-line__input" placeholder="20 dicembre"></label>
</div>
</body>
</html>
