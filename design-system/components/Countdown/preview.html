<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Countdown</title>
<style>html,body{margin:0} body{background:var(--surface);} .stage{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-5);padding:var(--space-5);}</style>
</head>
<body class="ss">
<div class="stage">
  <div class="ss-countdown" role="timer" aria-label="Mancano 12 giorni, 5 ore e 41 minuti">
    <div class="ss-countdown__unit"><span class="ss-countdown__value">12</span><span class="ss-countdown__label">giorni</span></div>
    <span class="ss-countdown__sep ss-star" aria-hidden="true"></span>
    <div class="ss-countdown__unit"><span class="ss-countdown__value">05</span><span class="ss-countdown__label">ore</span></div>
    <span class="ss-countdown__sep ss-star" aria-hidden="true"></span>
    <div class="ss-countdown__unit"><span class="ss-countdown__value">41</span><span class="ss-countdown__label">min</span></div>
  </div>
</div>
</body>
</html>
