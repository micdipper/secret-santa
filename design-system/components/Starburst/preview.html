<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Starburst</title>
<style>html,body{margin:0} body{background:var(--surface);} .stage{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-5);padding:var(--space-5);}</style>
</head>
<body class="ss">
<div class="stage" style="gap:var(--space-6)">
  <div class="ss-burst"><div><div class="ss-burst__value">12</div><span class="ss-burst__label">giorni</span></div></div>
  <div class="ss-burst ss-burst--ghiaccio" style="transform:rotate(6deg)"><div><div class="ss-burst__value">30</div><span class="ss-burst__label">euro</span></div></div>
  <div class="ss-burst ss-burst--small"><div><div class="ss-burst__value">7</div><span class="ss-burst__label">amici</span></div></div>
</div>
</body>
</html>
