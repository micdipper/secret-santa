<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Polaroid</title>
<style>html,body{margin:0} body{background:var(--surface);} .stage{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-5);padding:var(--space-5);}</style>
</head>
<body class="ss">
<div class="stage">
  <figure class="ss-polaroid" style="margin:0"><div class="ss-polaroid__img" style="display:grid;place-items:center"><span class="ss-star" style="font-size:48px;background:var(--gold)"></span></div><figcaption class="ss-polaroid__caption">Il maglione che sogno<br>Giulia · 2025</figcaption></figure>
  <figure class="ss-polaroid" style="margin:0;transform:rotate(var(--tilt-right))"><div class="ss-polaroid__img ss-wrap"></div><figcaption class="ss-polaroid__caption">Carta da regalo<br>Marzia · 2025</figcaption></figure>
</div>
</body>
</html>
